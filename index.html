<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="RMB Manutenzioni"/><meta name="theme-color" content="#1a4a6e"/><title>RMB Manutenzioni</title>
<style>

.tb{background:linear-gradient(135deg,rgba(26,74,110,0.97),rgba(15,45,69,0.97));padding:max(16px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:3px solid #c8873a;box-shadow:0 2px 12px rgba(0,0,0,.5)}

.lc{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#c8873a,#e8a854);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}

.md{background:linear-gradient(180deg,#1a4a6e,#0f2d45);border-radius:20px 20px 0 0;padding:22px 18px 48px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-top:3px solid #c8873a}

.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sb{border:none;border-radius:12px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.sb:active{transform:scale(.95)}
.na{width:100%;border-radius:10px;border:2px solid rgba(255,255,255,.15);padding:12px;font-size:16px;font-family:inherit;outline:none;background:rgba(0,0,0,.4);color:#e2f0fb;display:block;min-height:90px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.na:focus{border-color:#c8873a;background:rgba(0,0,0,.6)}
.inp{width:100%;border-radius:10px;border:2px solid rgba(255,255,255,.15);padding:12px;font-size:16px;outline:none;font-family:inherit;background:rgba(0,0,0,.4);color:#e2f0fb;-webkit-user-select:text;user-select:text;touch-action:manipulation;display:block;margin-bottom:8px}
.inp:focus{border-color:#c8873a}

/* TH CARD */
.th-card{background:linear-gradient(145deg,rgba(30,90,128,0.92),rgba(22,74,106,0.92));border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.08)}
.th-row{display:flex;gap:8px;margin-bottom:8px}
.th-inp{flex:1;border-radius:8px;border:2px solid rgba(255,255,255,.15);padding:10px;font-size:16px;background:rgba(0,0,0,.3);color:#e2f0fb;outline:none;font-family:inherit;-webkit-user-select:text;user-select:text;text-align:center}
.th-inp:focus{border-color:#c8873a}
.th-inp::placeholder{color:#5a9ab8;font-size:12px}
.th-result{border-radius:12px;padding:14px;text-align:center;margin-top:10px}
.th-big{font-size:32px;font-weight:900;color:#fff}
.th-label{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
/* FILTRO COLORE */
.filter-btn{flex:1;border:none;border-radius:10px;padding:10px 6px;color:#fff;font-size:12px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.filter-row{display:flex;gap:6px;margin-bottom:12px}
.alert-item{background:linear-gradient(145deg,rgba(30,90,128,0.92),rgba(22,74,106,0.92));border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid #dc2626}
.alert-sec{font-size:10px;color:#7eb8d4;font-weight:700;text-transform:uppercase;margin-bottom:3px}
.alert-name{font-size:14px;font-weight:800;color:#e2f0fb}
.alert-check{font-size:11px;color:#94a3b8;margin-top:4px}
</style>
</head><body>
<div id="root"></div>

<!-- MODALI SEPARATI DAL ROOT - fix tastiera -->
<div id="picker-modal" style="display:none" class="ov">
  <div class="md" onclick="event.stopPropagation()">
    <div class="mdt" id="picker-title">📋</div>
    <div class="sg" id="picker-btns"></div>
    <textarea class="na" id="picker-note" placeholder="Note (obbligatorie per Giallo/Rosso)..." rows="4"></textarea>
    <div class="btr">
      <button class="btn" style="background:#1e5a80;flex:1" onclick="pickPhoto()">📷 Foto</button>
      <button class="btn" style="background:#374151;min-width:72px" onclick="pickColor('none')">Reset</button>
    </div>
    <input type="file" id="picker-file" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
    <div id="picker-photo-preview" style="margin-top:10px"></div>
    <button class="btn" style="background:#6b7280;margin-top:12px" onclick="closePicker()">✕ Chiudi</button>
  </div>
</div>

<div id="reset-modal" style="display:none" class="ov" onclick="closeReset()">
  <div class="md" onclick="event.stopPropagation()">
    <div class="mdt">🔄 Reset Verdi</div>
    <div id="reset-text" style="font-size:14px;color:#7eb8d4;margin-bottom:16px"></div>
    <button class="btn" style="background:#16a34a" onclick="doReset()">Sì, azzera solo i verdi</button>
    <button class="btn" style="background:#1e5a80;margin-top:8px" onclick="closeReset()">Annulla</button>
  </div>
</div>

<div id="email-modal" style="display:none" class="ov" onclick="closeEmail()">
  <div class="md" onclick="event.stopPropagation()">
    <div class="mdt">📧 Invia Report al Capo</div>
    <div style="font-size:12px;color:#7eb8d4;margin-bottom:8px">Verranno inviati solo 🔴 Rossi e ⚠️ Gialli</div>
    <input class="inp" type="email" id="email-input" placeholder="email@capo.it">
    <button class="btn" style="background:#c8873a;margin-top:4px" onclick="sendEmail()">📨 Invia via Email</button>
    <button class="btn" style="background:#374151;margin-top:8px" onclick="copyReport()">📋 Copia negli Appunti</button>
    <button class="btn" style="background:#1e5a80;margin-top:8px" onclick="closeEmail()">Annulla</button>
  </div>
</div>

<script>
const ST={green:{label:"IDONEO",bg:"#16a34a",text:"#fff",emoji:"✅",short:"OK"},yellow:{label:"CRITICO",bg:"#d97706",text:"#fff",emoji:"⚠️",short:"!"},red:{label:"DA SISTEMARE",bg:"#dc2626",text:"#fff",emoji:"🔴",short:"KO"},blue:{label:"IN PROGRESS",bg:"#2563eb",text:"#fff",emoji:"🔵",short:"WIP"},none:{label:"Non verificato",bg:"#374151",text:"#9ca3af",emoji:"○",short:"—"}};
const PR=["red","yellow","blue","green","none"];
const NC=[{id:"rullo_traino",label:"Rullo di Traino"},{id:"rullo_folle",label:"Rullo di Folle"},{id:"tappeto",label:"Tappeto"},{id:"bandelle",label:"Bandelle"},{id:"centraggio",label:"Centraggio Nastro"},{id:"raschiatore",label:"Raschiatore"},{id:"motoriduttore",label:"Motoriduttore"},{id:"struttura",label:"Struttura"},{id:"cuscinetti",label:"Cuscinetti",subs:["Anteriore DX","Anteriore SX","Posteriore DX","Posteriore SX"]},{id:"ingrassatori",label:"Ingrassatori",subs:["Anteriore DX","Anteriore SX","Posteriore DX","Posteriore SX"]},{id:"rullini",label:"Rullini",subs:["Rulli di Ritorno","Rulli Guida-Nastro/Candeline","Rulli Interno Nastro"]}];
const SEC=[
  {key:"NASTRI",label:"Nastri",icon:"🎞️",color:"#c8873a",machines:["M3","M3BIS","M5","M6","M7","M8","M13","M13B","M14","M21","M27","M28","M31","M32","M33","M34","M36","M37","M38","M39","M40","M41","M42","M35","M46","M43","M50","M51","M50A","M51A","M54","M55","M57","M60","M61","M62","M63","M64","M64BIS","M65","M66","M67","M68","M200/201","M20V201","M202","M203","M204","M205","M206","M207","M208","M209","M210","M211","M212","M220"],specialChecks:NC},
  {key:"STEINERT",label:"Steinert",icon:"🧲",color:"#3b82f6",machines:["ST 15","ST 16","ST 17","ST 18","ST 19","ST 20","4T"],checks:["Alberi","Camice","Cuscinetto Post DX","Cuscinetto Post SX","Tappeto","Bandelle","Rampa Carico","Paratia Divisoria","Centraggio"]},
  {key:"TITECH",label:"Titech",icon:"🔬",color:"#8b5cf6",machines:["0-20","POLYFINDER","SOPRAVAGLIO","20-50"],checks:["Alberi","Tappeto","Bandelle","Gommato Rulli","Rampa Carico","Cuscinetto Ant DX","Cuscinetto Ant SX","Cuscinetto Post DX","Cuscinetto Post SX","Barra Separazione"]},
  {key:"DBOX",label:"DBox",icon:"📦",color:"#0891b2",machines:["26","44 BIS"],checks:["Gomme Ingresso","Cuscinetti Ingresso DX","Cuscinetti Ingresso SX","Ingrassatori Ingresso DX","Ingrassatori Ingresso SX","Alberi Ingresso","Gomme Pesante","Cuscinetti Pesante DX","Cuscinetti Pesante SX","Ingrassatori Pesante DX","Ingrassatori Pesante SX","Alberi Pesante","Gomme Leggero","Cuscinetti Leggero DX","Cuscinetti Leggero SX","Ingrassatori Leggero DX","Ingrassatori Leggero SX","Alberi Leggero","Gomme Ciclone","Cuscinetti Ciclone DX","Cuscinetti Ciclone SX","Ingrassatori Ciclone DX","Ingrassatori Ciclone SX","Alberi Ciclone","Ventola","Vibrazioni Ventola","Camicia di Raccordo"]},
  {key:"COCLEA",label:"Coclea",icon:"🌀",color:"#b45309",machines:["M217","M218/M219","M104/64.1","E7B SX","E7B DX"],checks:["Spirale","Motore","Cuscinetti","Ingrassatori"]},
  {key:"RUOTE_TEFLON",label:"Ruote e Teflon",icon:"⚙️",color:"#475569",machines:["Ruota Ingresso SX 4","Ruota Scarico SX 4","Ruota Ingresso Centrale 4","Ruota Scarico Centrale 4","Ruota Ingresso DX 4","Ruota Scarico DX 4","Ruota Teflon 4","Ruota Ingresso SX 43","Ruota Scarico SX 43","Ruota Ingresso DX 43","Ruota Scarico DX 43","Ruota Teflon 43"],checks:["Stato Gomma","Alberi","Cuscinetti","Ingrassatori"]},
  {key:"VIBRANTI",label:"Vibranti",icon:"📳",color:"#be185d",machines:["CV4","CV4.1","CV9","CV9.1","CV10","CV10.1","CV11","CV11.1","CV12","CV12.1","CV22","CV22.1","CV25","CV25.1","CV29","CV29.1","CV44","CV44.1","CV47","CV47.1","CV52","CV52.1","CV58","CV58.1"],checks:["Catene","Viti","Crepe","Rumore","Gommini"]},
  {key:"ROTOCELLE",label:"Rotocelle e Shultz",icon:"🔄",color:"#065f46",machines:["M213","M214","M215","M216","SHULTZ 1 E7B","SHULTZ 2 E7B","E7B SX","E7B DX"],checks:["Gomme","Cuscinetti","Ingrassatori","Alberi","Motori"]}
];

const SK="rmb_manutenzioni_DEFINITIVO";
let D={};try{const r=localStorage.getItem(SK);if(r)D=JSON.parse(r);}catch{}
function sv(){try{localStorage.setItem(SK,JSON.stringify(D));}catch{}}

// TH data
let TH={};
try{const r=localStorage.getItem("rmb_th");if(r)TH=JSON.parse(r);}catch{}
function svTH(){try{localStorage.setItem("rmb_th",JSON.stringify(TH));}catch{}}

let VIEW="home",SI=0,MID=null,PICKER=null,RESET_TARGET=null,pickerPhoto=null,FILTER=null;

function gc(sk,m,c){return D?.[sk]?.[m]?.[c]||{status:"none",note:"",photo:null,ts:null};}
function gcs(sec){return sec.specialChecks?sec.specialChecks.map(c=>c.id):sec.checks;}
function gcl(sec,cid){if(sec.specialChecks){const f=sec.specialChecks.find(c=>c.id===cid);return f?f.label:cid;}return cid;}
function gsubs(sec,cid){if(sec.specialChecks){const f=sec.specialChecks.find(c=>c.id===cid);return f&&f.subs?f.subs:null;}return null;}
function gcw(sk,m,cid,subs){if(!subs)return gc(sk,m,cid).status;let w="none";for(const s of subs){const st=gc(sk,m,cid+"__"+s).status;if(PR.indexOf(st)<PR.indexOf(w))w=st;}return w;}
function gw(sk,m,sec){let w="none";for(const cid of gcs(sec)){const s=gcw(sk,m,cid,gsubs(sec,cid));if(PR.indexOf(s)<PR.indexOf(w))w=s;}return w;}
function gl(sk,m,sec){let l=null;for(const cid of gcs(sec)){const subs=gsubs(sec,cid);if(subs){for(const sub of subs){const ts=gc(sk,m,cid+"__"+sub).ts;if(ts&&(!l||ts>l))l=ts;}}const ts=gc(sk,m,cid).ts;if(ts&&(!l||ts>l))l=ts;}return l;}
function gpct(sk,m,sec){let t=0,d=0;for(const cid of gcs(sec)){const subs=gsubs(sec,cid);if(subs){t+=subs.length;for(const sub of subs){if(gc(sk,m,cid+"__"+sub).status!=="none")d++;}}else{t++;if(gc(sk,m,cid).status!=="none")d++;}}return t===0?0:Math.round(d/t*100);}
function gsecpct(sec){let t=0;for(const m of sec.machines)t+=gpct(sec.key,m,sec);return Math.round(t/sec.machines.length);}
function gsc(sec){const ct={red:0,yellow:0,blue:0,green:0,none:0};for(const m of sec.machines)ct[gw(sec.key,m,sec)]++;return ct;}
function fd(ts){if(!ts)return null;const d=new Date(ts);return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});}

function toast(msg,warn=false){
  let t=document.getElementById("toast-el");
  if(!t){t=document.createElement("div");t.id="toast-el";t.className="tst";document.body.appendChild(t);}
  t.textContent=msg;t.style.background=warn?"#d97706":"#16a34a";t.style.display="block";
  clearTimeout(t._timer);t._timer=setTimeout(()=>{t.style.display="none";},2800);
}

function ac(sk,m,c,status,note,photo){
  if(!D[sk])D[sk]={};if(!D[sk][m])D[sk][m]={};
  D[sk][m][c]={status,note:note||"",photo:photo||null,ts:Date.now()};sv();
}

// RESET - solo verdi
function openReset(type,sk,mid){
  RESET_TARGET={type,sk,mid};
  const sec=SEC.find(s=>s.key===sk);
  document.getElementById("reset-text").textContent=type==="machine"?
    "Azzera solo ✅ VERDI di "+mid+". Rossi, Gialli e Blu restano.":
    "Azzera solo ✅ VERDI di "+sec.label+". Rossi, Gialli e Blu restano.";
  document.getElementById("reset-modal").style.display="flex";
}
function closeReset(){document.getElementById("reset-modal").style.display="none";RESET_TARGET=null;}
function doReset(){
  if(!RESET_TARGET)return;
  const{type,sk,mid}=RESET_TARGET;
  if(type==="machine"){if(D[sk]&&D[sk][mid]){for(const k of Object.keys(D[sk][mid])){if(D[sk][mid][k].status==="green")delete D[sk][mid][k];}}}
  else{const sec=SEC.find(s=>s.key===sk);if(sec&&D[sk]){for(const m of sec.machines){if(D[sk][m]){for(const k of Object.keys(D[sk][m])){if(D[sk][m][k].status==="green")delete D[sk][m][k];}}}}}
  sv();closeReset();toast("Reset verdi ✓");render();
}

// PICKER - modal separato, tastiera stabile
function openPicker(sk,mid,check,label){
  PICKER={sk,mid,check};pickerPhoto=null;
  const cd=gc(sk,mid,check);
  document.getElementById("picker-title").textContent="📋 "+label;
  document.getElementById("picker-note").value=cd.note||"";
  document.getElementById("picker-photo-preview").innerHTML=cd.photo?'<img src="'+cd.photo+'" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover">':'';
  pickerPhoto=cd.photo||null;
  const btns=document.getElementById("picker-btns");btns.innerHTML="";
  ["green","yellow","red","blue"].forEach(k=>{
    const b=document.createElement("button");b.className="sb";b.style.background=ST[k].bg;
    b.innerHTML='<span style="font-size:28px">'+ST[k].emoji+'</span><span style="font-size:10px;color:#fff;font-weight:800;text-align:center">'+ST[k].label+'</span>';
    b.onclick=()=>pickColor(k);btns.appendChild(b);
  });
  document.getElementById("picker-modal").style.display="flex";
}
function closePicker(){document.getElementById("picker-modal").style.display="none";PICKER=null;pickerPhoto=null;}
function pickColor(color){
  if(!PICKER)return;
  const note=document.getElementById("picker-note").value.trim();
  if((color==="red"||color==="yellow")&&!note){toast("⚠️ Nota obbligatoria!",true);return;}
  ac(PICKER.sk,PICKER.mid,PICKER.check,color,note,pickerPhoto);
  closePicker();toast("Salvato ✓");render();
}
function pickPhoto(){document.getElementById("picker-file").click();}
function handlePhoto(input){
  const f=input.files?.[0];if(!f)return;
  // Comprimi foto prima di salvare
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const MAX=1200;let w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      pickerPhoto=canvas.toDataURL("image/jpeg",0.75);
      document.getElementById("picker-photo-preview").innerHTML='<img src="'+pickerPhoto+'" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover">';
      toast("Foto allegata ✓");
    };img.src=ev.target.result;
  };reader.readAsDataURL(f);
}

// EMAIL - solo rossi e gialli
function openEmail(){document.getElementById("email-modal").style.display="flex";}
function closeEmail(){document.getElementById("email-modal").style.display="none";}
function buildReport(){
  const now=new Date().toLocaleString("it-IT");
  let t="REPORT MANUTENZIONI RMB\n"+now+"\n"+"═".repeat(40)+"\n⚠️ Solo anomalie (Rossi e Gialli)\n\n";
  let hasContent=false;
  for(const s of SEC){
    let ls=[];
    for(const m of s.machines){
      const w=gw(s.key,m,s);
      if(w!=="red"&&w!=="yellow")continue;
      let ml=["  ▸ "+m+" ["+ST[w].label+"]"];
      for(const cid of gcs(s)){
        const subs=gsubs(s,cid);
        if(subs){for(const sub of subs){const cd=gc(s.key,m,cid+"__"+sub);if(cd.status==="red"||cd.status==="yellow")ml.push("    • "+gcl(s,cid)+" - "+sub+": "+ST[cd.status].label+(cd.note?" → "+cd.note:""));}}
        else{const cd=gc(s.key,m,cid);if(cd.status==="red"||cd.status==="yellow")ml.push("    • "+gcl(s,cid)+": "+ST[cd.status].label+(cd.note?" → "+cd.note:""));}
      }
      ls.push(ml.join("\n"));
    }
    if(ls.length){t+=s.icon+" "+s.label.toUpperCase()+"\n"+ls.join("\n")+"\n\n";hasContent=true;}
  }
  if(!hasContent)t+="Nessuna anomalia rilevata ✅\n";
  return t;
}

function calcTH(){
  const inizio=document.getElementById("th-inizio").value;
  const fine=document.getElementById("th-fine").value;
  const target=parseFloat(document.getElementById("th-target").value);
  if(!inizio||!fine||isNaN(target)){toast("Compila tutti i campi",true);return;}
  const [h1,m1]=inizio.split(":").map(Number);
  const [h2,m2]=fine.split(":").map(Number);
  let minTot=(h2*60+m2)-(h1*60+m1);
  if(minTot<=0)minTot+=24*60;
  const oreTot=minTot/60;
  const totaleDaProdurre=Math.round(oreTot*target);
  const righe=[];
  let minCorrente=h1*60+m1;let progressivo=0;let ora=1;
  while(minCorrente<h2*60+m2){
    const minProssima=Math.min(minCorrente+60,h2*60+m2);
    const frizione=(minProssima-minCorrente)/60;
    progressivo+=target*frizione;
    const hh=String(Math.floor(minProssima/60)%24).padStart(2,"0");
    const mm=String(minProssima%60).padStart(2,"0");
    righe.push({ora,orario:hh+":"+mm,target:Math.round(progressivo),reale:"",parziale:Math.round(target*frizione)});
    minCorrente=minProssima;ora++;
  }
  TH={inizio,fine,target,oreTot:oreTot.toFixed(1),totaleDaProdurre,righe,ts:Date.now()};
  svTH();render();
}
function aggiornaReale(idx,val){
  if(!TH.righe)return;
  TH.righe[idx].reale=val;
  svTH();
  // Aggiorna solo il chip e il colore senza re-render completo
  const rows=document.querySelectorAll('[data-riga]');
  // Re-render solo sezione TH per non perdere focus
  const thSection=document.querySelector('.sc');
  if(thSection&&VIEW==="th"){
    // Aggiorna solo i chip di stato
    const allInputs=document.querySelectorAll('[type="number"][oninput]');
    // calcola tutti i cumulativi
    let cumReale=0;
    TH.righe.forEach((r,i)=>{
      cumReale+=(parseFloat(r.reale)||0);
      const diff=r.reale!==""?cumReale-r.target:null;
      const inp=allInputs[i];
      if(inp&&diff!==null){
        const ok=diff>=0;
        inp.style.borderColor=ok?"#16a34a":"#dc2626";
        const parent=inp.parentElement;
        let chip=parent.querySelector('.th-chip');
        if(!chip){chip=document.createElement('div');chip.className='th-chip';chip.style.cssText='font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;color:#fff;white-space:nowrap';parent.appendChild(chip);}
        chip.style.background=ok?"#16a34a":"#dc2626";
        chip.textContent=(ok?"+":"")+diff.toFixed(0)+"t";
      }
    });
  }
}

function getAllByColor(color){
  const result=[];
  for(const sec of SEC){
    for(const m of sec.machines){
      const w=gw(sec.key,m,sec);
      if(w===color)result.push({sec,m});
    }
  }
  return result;
}
