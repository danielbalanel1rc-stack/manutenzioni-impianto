<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="Manutenzioni"/><meta name="theme-color" content="#0f172a"/><title>Manutenzioni Impianto</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;overscroll-behavior:none}#root{max-width:480px;margin:0 auto;min-height:100vh}.topbar{background:#0f172a;padding:max(14px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:8px;border-bottom:3px solid #15803d}.topbar-title{font-size:17px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar-sub{font-size:11px;color:#94a3b8;margin-top:1px}.back-btn{background:none;border:none;color:#fff;font-size:36px;cursor:pointer;padding:0 8px 0 0;line-height:1;flex-shrink:0}.icon-btn{background:#1e293b;border:none;border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer;color:#fff;flex-shrink:0}.icon-btn.red{background:#fee2e2;color:#dc2626}.scroll{padding:10px 10px max(100px,calc(80px + env(safe-area-inset-bottom)))}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sec-card{background:#fff;border-radius:14px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.06)}.sec-card:active{transform:scale(.97)}.sec-icon{font-size:26px;margin-bottom:4px}.sec-name{font-size:13px;font-weight:800;color:#111;line-height:1.2;margin-bottom:6px}.bubble
